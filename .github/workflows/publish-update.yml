name: Publish Whimsy HTML update

on:
  push:
    paths:
      - "release-request.json"

permissions:
  contents: write

concurrency:
  group: whimsy-html-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re

          root = pathlib.Path(".")
          req = json.loads((root / "release-request.json").read_text(encoding="utf-8"))
          version = str(req["version"]).strip()
          expected = str(req["sha256"]).strip().lower()

          parts = sorted((root / ".release-payload").glob("*.part"))
          if not parts:
              raise SystemExit("No release payload parts found")

          encoded = "".join(p.read_text(encoding="ascii").strip() for p in parts)
          compressed = base64.b64decode(encoded, validate=True)
          html = lzma.decompress(compressed, format=lzma.FORMAT_XZ)

          actual = hashlib.sha256(html).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA mismatch: expected {expected}, got {actual}")

          head = html[:65536].decode("utf-8", errors="ignore")
          marker = re.search(r"WHIMSY_BUNDLE_VERSION\s*:\s*([A-Za-z0-9._-]+)", head, re.I)
          if not marker or marker.group(1) != version:
              raise SystemExit(f"Bundle marker does not match request version {version}")

          (root / "app.html").write_bytes(html)
          manifest = {
              "version": version,
              "url": "app.html",
              "sha256": actual,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print("Version:", version)
          print("HTML bytes:", len(html))
          print("SHA256:", actual)
          PY

      - name: Publish atomically
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("release-request.json"))["version"])')"
          rm -rf .release-payload release-request.json
          git config user.name "Whimsy Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app.html manifest.json .release-payload release-request.json
          git commit -m "Publish Whimsy ${VERSION}"
          git push
